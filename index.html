<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KCN Long Thành — Tra cứu Nhà xưởng</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KCN Long Thành">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.png">
<style>
:root{--lease:#64748b;--avail:#a855f7;--hold:#f59e0b;--empty:#94a3b8;--brand:#0e7490;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#0b1220;overscroll-behavior:none;}
.app{position:relative;max-width:480px;margin:0 auto;height:100dvh;overflow:hidden;background:#e7edf3;}
.topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:50;}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:24px;padding:10px 13px;box-shadow:0 6px 20px rgba(15,23,42,.18);}
.search .back{border:0;background:none;font-size:22px;color:var(--brand);cursor:pointer;display:none;padding:0;line-height:1;}
.search input{border:0;outline:0;font-size:15px;flex:1;background:transparent;min-width:0;}
.bar2{position:absolute;top:calc(62px + env(safe-area-inset-top));left:10px;right:10px;z-index:50;display:flex;gap:6px;flex-wrap:wrap;}
.crumb{background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:13px;}
.tb{background:#fff;border:0;font-size:11px;font-weight:700;padding:5px 10px;border-radius:13px;box-shadow:0 3px 10px rgba(15,23,42,.15);cursor:pointer;color:#334155;}
.tb.on{background:#dc2626;color:#fff;} .tb.g{background:#16a34a;color:#fff;}
.sug{position:absolute;top:calc(56px + env(safe-area-inset-top));left:10px;right:10px;z-index:56;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.25);display:none;max-height:44vh;overflow-y:auto;}
.sug div{padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:9px;}
.sug i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;} .sug small{color:var(--muted);margin-left:auto;font-size:11px;}
.screen{position:absolute;inset:0;} .screen.hidden{display:none;}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#eef2f7;}
.viewport.editing{cursor:crosshair;}
.stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
.stage img{display:block;width:1700px;height:auto;user-select:none;pointer-events:none;}
.stage svg{position:absolute;left:0;top:0;width:1700px;}
/* ==== POLYGON LÔ — kiểu DNAILIS ==== */
.lot{cursor:pointer;fill:rgba(148,163,184,.001);stroke:transparent;stroke-width:3;transition:fill .18s,stroke .18s;}
.lot.lease{fill:rgba(100,116,139,.30);stroke:rgba(71,85,105,.55);}
.lot.avail{fill:rgba(168,85,247,.34);stroke:rgba(126,34,206,.6);}
.lot.hold{fill:rgba(245,158,11,.34);stroke:rgba(180,83,9,.6);}
.lot:hover{fill:rgba(14,165,233,.22);}
.lot.sel{fill:rgba(34,197,94,.42);stroke:#16a34a;stroke-width:8;filter:drop-shadow(0 0 10px rgba(34,197,94,.85));}
.lotlbl{font-size:11px;font-weight:800;fill:#0f172a;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none;opacity:0;}
.lotlbl.show{opacity:1;}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:4;}
.pin .dot{width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);background:var(--empty);}
.pin.lease .dot{background:var(--lease);} .pin.avail .dot{background:var(--avail);}
.pin.hold .dot{background:var(--hold);} .pin.nx .dot{background:#0ea5e9;width:21px;height:21px;}
.pin.sel .dot{background:#16a34a!important;outline:4px solid rgba(34,197,94,.45);outline-offset:2px;transform:scale(1.25);}
.pin .nm{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:rgba(15,23,42,.92);color:#fff;font-size:10px;font-weight:700;white-space:nowrap;padding:3px 7px;border-radius:8px;opacity:0;pointer-events:none;}
.pin.show .nm,.pin.sel .nm{opacity:1;}
.pin.done .dot{border-color:#22c55e;border-width:3px;}
.zoom{position:absolute;right:10px;bottom:180px;z-index:40;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.2);}
.zoom button{border:0;width:42px;height:40px;background:#fff;font-size:18px;cursor:pointer;} .zoom .dv{height:1px;background:var(--line);}
.lblBtn{position:absolute;right:10px;bottom:265px;z-index:40;background:#fff;border:0;border-radius:12px;width:42px;height:40px;box-shadow:0 4px 14px rgba(15,23,42,.2);font-size:15px;cursor:pointer;}
.lblBtn.on{background:var(--brand);color:#fff;}
.legend{position:absolute;left:10px;bottom:180px;z-index:40;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 4px 14px rgba(15,23,42,.18);font-size:11px;}
.legend b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0;} .legend i{width:11px;height:11px;border-radius:3px;}
.prog{position:absolute;left:10px;bottom:150px;z-index:40;background:#0f172a;color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:10px;}
.edithelp{position:absolute;left:10px;right:10px;top:calc(98px + env(safe-area-inset-top));z-index:44;background:#dc2626;color:#fff;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;display:none;line-height:1.45;}
.edithelp.on{display:block;}
/* ==== PANEL trượt lên từ dưới ==== */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 34px rgba(15,23,42,.35);transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);max-height:76%;display:flex;flex-direction:column;overflow:hidden;}
.panel.open{transform:translateY(0);}
.grip{width:38px;height:4px;background:#cbd5e1;border-radius:3px;margin:8px auto 2px;}
.ph{display:flex;align-items:center;gap:9px;padding:6px 14px 10px;border-bottom:1px solid var(--line);}
.ph h3{margin:0;font-size:16px;flex:1;}
.ph .nav{color:#0284c7;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.ph .cl{width:25px;height:25px;border-radius:50%;background:#dc2626;color:#fff;border:0;font-size:12px;cursor:pointer;flex:0 0 auto;}
.pb{padding:0 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;}
.fields{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 0;}
.fields .k{color:#0284c7;font-size:14px;} .fields .v{font-weight:700;font-size:14px;}
.band{background:#d9f99d;color:#b91c1c;font-weight:700;font-size:13px;padding:6px 10px;border-radius:4px;margin:2px 0 6px;}
.r{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;}
.r .k{color:var(--muted);} .r .v{font-weight:600;text-align:right;word-break:break-word;}
.r .v.na{color:#cbd5e1;font-weight:400;}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;color:#fff;font-size:12px;font-weight:700;}
.acts{display:flex;gap:8px;margin-top:12px;}
.btn{flex:1;border:0;padding:12px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.btn.p{background:var(--brand);color:#fff;} .btn.g{background:#f1f5f9;color:#0f172a;}
.btn.e{background:#f59e0b;color:#fff;} .btn.d{background:#fee2e2;color:#b91c1c;} .btn.s{background:#16a34a;color:#fff;}
.fm label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:9px 0 3px;text-transform:uppercase;}
.fm input,.fm select,.fm textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:15px;font-family:inherit;outline:0;background:#fff;color:var(--ink);}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--brand);}
.fm textarea{min-height:58px;resize:vertical;} .fm .two{display:flex;gap:8px;} .fm .two>div{flex:1;}
.nt{font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.5;}
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.65);display:none;align-items:center;justify-content:center;padding:16px;}
.modal.on{display:flex;}
.mcard{background:#fff;border-radius:14px;width:100%;max-width:440px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.mcard h4{margin:0;padding:13px 15px;background:#f1f5f9;font-size:15px;border-bottom:1px solid var(--line);}
.mcard .mb{padding:13px 15px;overflow-y:auto;}
.mcard textarea{width:100%;height:180px;border:1.5px solid var(--line);border-radius:8px;padding:9px;font-family:ui-monospace,monospace;font-size:10px;}
.mcard .mf{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:22px;z-index:95;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.on{opacity:1;}
.ios-tip{position:absolute;left:10px;right:10px;bottom:20px;z-index:70;background:#0f172a;color:#fff;font-size:13px;line-height:1.5;padding:11px 13px;border-radius:14px;display:none;}
.ios-tip b{color:#fde68a;} .ios-tip .x{float:right;color:#94a3b8;cursor:pointer;font-weight:700;}
.subwrap{position:absolute;inset:0;background:#f4f7fb;} .subwrap svg{width:100%;height:100%;}
.unit{cursor:pointer;} .unit rect{stroke-width:2;transition:fill .18s;}
.unit text{font-size:13px;font-weight:700;fill:#0f172a;pointer-events:none;}
.unit .ar{font-size:9px;font-weight:600;fill:#334155;}
.unit.sel rect{stroke:#16a34a;stroke-width:5;fill:#22c55e;fill-opacity:.55;}
.road{fill:#f0a63c;} .rl{font-size:10px;fill:#7c4a12;font-weight:700;} .gl{font-size:12px;font-weight:800;fill:#0e7490;}

/* ==== CÔNG CỤ VẼ TAY ==== */
.tools{position:absolute;left:10px;right:10px;top:calc(94px + env(safe-area-inset-top));z-index:46;display:none;gap:6px;flex-wrap:wrap;}
.tools.on{display:flex;}
.tl{background:#fff;border:0;font-size:11px;font-weight:700;padding:7px 11px;border-radius:13px;box-shadow:0 3px 10px rgba(15,23,42,.2);cursor:pointer;color:#334155;}
.tl.act{background:#0ea5e9;color:#fff;}
.tl.dg{background:#fee2e2;color:#b91c1c;}
.drawbar{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:65;display:none;gap:7px;background:#0f172a;padding:9px;border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.4);}
.drawbar.on{display:flex;}
.drawbar button{flex:1;border:0;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.drawbar .ok{background:#16a34a;color:#fff;} .drawbar .un{background:#334155;color:#fff;} .drawbar .ca{background:#7f1d1d;color:#fff;}
.drawbar .cnt{color:#fde68a;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 8px;flex:0 0 auto;}
.hint2{position:absolute;left:10px;right:10px;top:calc(130px + env(safe-area-inset-top));z-index:46;background:#0ea5e9;color:#fff;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;display:none;line-height:1.45;}
.hint2.on{display:block;}
.vtx{fill:#fff;stroke:#0ea5e9;stroke-width:3;cursor:grab;}
.vtx.big{r:11;}
.draft{fill:rgba(14,165,233,.25);stroke:#0ea5e9;stroke-width:4;stroke-dasharray:10 6;}
.dpt{fill:#0ea5e9;stroke:#fff;stroke-width:2.5;}

.tb.sync{background:#0ea5e9;color:#fff;}
.tb.busy{opacity:.6;}
.mcard input.url{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin-bottom:8px;}
.mcard .step{font-size:12px;color:#334155;line-height:1.6;margin:0 0 10px;}
.mcard .step b{color:#0e7490;}
.sbadge{position:absolute;right:10px;bottom:150px;z-index:40;background:#0ea5e9;color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:10px;display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="ios-tip" id="iosTip"><span class="x" onclick="iosTip.style.display='none'">✕</span>
    Cài trên iPhone: chạm <b>Chia sẻ</b> ⎙ ở Safari → <b>Thêm vào MH chính</b>.</div>

  <div class="topbar"><div class="search">
    <button class="back" id="btnBack">‹</button>
    <input id="q" placeholder="Tìm công ty / lô / UNIT…" autocomplete="off">
  </div></div>
  <div class="sug" id="sug"></div>

  <div class="bar2">
    <span class="crumb" id="crumb">Sơ đồ tổng</span>
    <button class="tb" id="btnEdit">✏️ Biên tập</button>
    <button class="tb g" id="btnExport">⬇ Xuất</button>
    <button class="tb" id="btnImport">⬆ Nhập</button>
    <button class="tb" id="btnSheet">⚙️ Sheet</button>
    <button class="tb" id="btnUpd">🔄 Cập nhật</button>
    <button class="tb" id="btnSync" style="display:none">↻ Tải Sheet</button>
    <button class="tb" id="installBtn" style="display:none">⤓ Cài app</button>
  </div>
  
  <div class="tools" id="tools">
    <button class="tl act" id="tSel">👆 Chọn</button>
    <button class="tl" id="tDraw">✒️ Vẽ lô</button>
    <button class="tl" id="tPin">📍 Ghim</button>
    <button class="tl" id="tVtx">🔧 Sửa đỉnh</button>
    <button class="tl dg" id="tClear">🗑 Xoá lô tự động</button>
  </div>
  <div class="hint2" id="hint2"></div>
  <div class="drawbar" id="drawbar">
    <span class="cnt" id="dcnt">0 đỉnh</span>
    <button class="un" id="dUndo">↶ Bỏ đỉnh</button>
    <button class="ok" id="dDone">✓ Hoàn tất</button>
    <button class="ca" id="dCancel">✕ Huỷ</button>
  </div>
  <div class="edithelp" id="ehelp"><b>ĐANG BIÊN TẬP</b> — Chạm 1 lô để điền thông tin.
    Chạm vùng trống để tạo ô ghim mới. Kéo–thả ghim để dời vị trí.</div>

  <div class="screen" id="scMaster">
    <div class="viewport" id="vp"><div class="stage" id="stage">
      <img id="mapimg" alt="Bản đồ KCN Long Thành">
      <svg id="ov" xmlns="http://www.w3.org/2000/svg"><g id="lots"></g><g id="lbls"></g><g id="hnd"></g><g id="drf"></g></svg>
    </div></div>
    <button class="lblBtn" id="lblBtn">🏷</button>
    <div class="zoom"><button id="zin">+</button><div class="dv"></div><button id="zout">−</button></div>
    <div class="legend"><b>Chú thích</b>
      <div><i style="background:#e2e8f0;border:1px solid #94a3b8"></i> Chưa nhập</div>
      <div><i style="background:#94a3b8"></i> Đã cho thuê</div>
      <div><i style="background:#a855f7"></i> Còn trống</div>
      <div><i style="background:#f59e0b"></i> Giữ chỗ</div>
      <div><i style="background:#22c55e"></i> Đang chọn</div>
    </div>
    <div class="prog" id="prog"></div>
    <div class="sbadge" id="sbadge">Sheet</div>
  </div>

  <div class="screen hidden" id="scGD6">
    <div class="subwrap"><svg viewBox="0 0 400 660" preserveAspectRatio="xMidYMid meet">
      <rect class="road" x="0" y="300" width="400" height="60"/>
      <rect class="road" x="185" y="0" width="30" height="300"/>
      <rect class="road" x="185" y="360" width="30" height="300"/>
      <text class="rl" x="300" y="336">Đường M.13</text>
      <text class="gl" x="14" y="28">Cụm RBF — UNIT 73–80</text>
      <g id="ug"></g></svg></div>
  </div>

  <div class="panel" id="panel">
    <div class="grip"></div>
    <div class="ph"><h3 id="pt">Thông tin</h3><span class="nav" id="pnav">🚗 Dẫn đường</span><button class="cl" id="pcl">✕</button></div>
    <div class="pb" id="pb"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="mcard">
  <h4 id="mtitle">Dữ liệu</h4>
  <div class="mb"><p class="nt" id="mdesc"></p><textarea id="mta"></textarea></div>
  <div class="mf" id="mfoot"></div></div></div>
<div class="toast" id="toast"></div>

<script src="seed.js"></script>

const LB={lease:"Đã cho thuê",avail:"Còn trống",hold:"Đang giữ chỗ","":"Chưa xác định"};
const CO={lease:"#64748b",avail:"#a855f7",hold:"#f59e0b","":"#cbd5e1"};
const LOAI={dn:"Doanh nghiệp",dat:"Lô đất",nx:"Cụm nhà xưởng","":"Lô chưa đặt tên"};
const KEY='kcn_lt_v3';
let CELLS=[],IH=1789,editMode=0,lblOn=0,sel=null;

function load(){try{const s=localStorage.getItem(KEY);if(s){CELLS=JSON.parse(s);return;}}catch(e){}
  CELLS=JSON.parse(JSON.stringify(SEED_CELLS));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(CELLS));}catch(e){toast('Không lưu được — hãy bấm ⬇ Xuất');}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function filled(c){return !!(c.dt||c.nganh||c.st||c.gia||c.hopdong||c.lienhe||c.link||c.ghichu);}
load();

/* ===== render ===== */
const stage=$('stage'),vp=$('vp'),ov=$('ov');
function render(){
  IH=$('mapimg').naturalHeight*(1700/$('mapimg').naturalWidth)||1789;
  ov.setAttribute('viewBox',`0 0 1700 ${IH}`); ov.setAttribute('height',IH);
  const L=$('lots'),T=$('lbls'); L.innerHTML='';T.innerHTML='';
  stage.querySelectorAll('.pin').forEach(n=>n.remove());
  CELLS.forEach(c=>{
    if(c.pts){
      const pg=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      pg.setAttribute('points', c.pts.map(p=>`${p[0]/100*1700},${p[1]/100*IH}`).join(' '));
      pg.setAttribute('class','lot '+(c.st||''));
      pg.dataset.id=c.id; L.appendChild(pg);
      if(c.ten){const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
        tx.setAttribute('x',c.cx/100*1700);tx.setAttribute('y',c.cy/100*IH);
        tx.setAttribute('text-anchor','middle');tx.setAttribute('class','lotlbl'+(lblOn?' show':''));
        tx.textContent=c.ten;T.appendChild(tx);}
    }else{
      const d=document.createElement('div');
      d.className='pin '+(c.loai==='nx'?'nx':(c.st||''))+(filled(c)?' done':'')+(lblOn?' show':'');
      d.style.left=c.cx+'%';d.style.top=c.cy+'%';d.dataset.id=c.id;
      d.innerHTML='<div class="nm">'+(c.ten||'Ô mới')+'</div><div class="dot"></div>';
      stage.appendChild(d);
    }
  });
  scalePins(); updProg(); if(sel)markSel(sel); if(typeof drawHandles==='function')drawHandles();
}
function scalePins(){const inv=Math.min(2.2,Math.max(.55,1/sc));
  stage.querySelectorAll('.pin').forEach(p=>p.style.transform=`translate(-50%,-50%) scale(${inv})`);}
function updProg(){const t=CELLS.length,d=CELLS.filter(filled).length;
  $('prog').textContent=`Đã nhập ${d}/${t} ô`;}

/* ===== pan/zoom ===== */
let tx=0,ty=0,sc=1,minS=.35,maxS=8;
function fit(){sc=vp.clientWidth/1700;minS=sc*.75;tx=0;ty=105;ap();}
function ap(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;scalePins();if(typeof drawDraft==='function'){drawDraft();drawHandles();}}
$('mapimg').addEventListener('load',()=>{fit();render();});
addEventListener('resize',fit);
function zm(cx,cy,f){const r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
  const ns=Math.min(maxS,Math.max(minS,sc*f));tx=px-(px-tx)*(ns/sc);ty=py-(py-ty)*(ns/sc);sc=ns;ap();}
$('zin').onclick=()=>zm(vp.clientWidth/2,vp.clientHeight/2,1.35);
$('zout').onclick=()=>zm(vp.clientWidth/2,vp.clientHeight/2,.74);
vp.addEventListener('wheel',e=>{e.preventDefault();zm(e.clientX,e.clientY,e.deltaY<0?1.15:.87);},{passive:false});
$('lblBtn').onclick=()=>{lblOn=!lblOn;$('lblBtn').classList.toggle('on',lblOn);
  ov.querySelectorAll('.lotlbl').forEach(n=>n.classList.toggle('show',lblOn));
  stage.querySelectorAll('.pin').forEach(n=>n.classList.toggle('show',lblOn));};
function toPct(cx,cy){const r=vp.getBoundingClientRect();
  return {x:+(((cx-r.left-tx)/sc)/1700*100).toFixed(2), y:+(((cy-r.top-ty)/sc)/IH*100).toFixed(2)};}

/* ===== chạm / kéo ===== */
let drag=0,moved=0,sx,sy,ox,oy,pts=new Map(),pd=0,dragCell=null,dragEl=null,dragVtx=null;
vp.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,e);moved=0;sx=e.clientX;sy=e.clientY;
  if(editMode&&tool==='vtx'&&e.target.classList&&e.target.classList.contains('vtx')){
    dragVtx=+e.target.dataset.i;drag=0;return;}
  const p=e.target.closest('.pin');
  if(editMode&&tool==='sel'&&p){dragCell=CELLS.find(c=>c.id===p.dataset.id);dragEl=p;drag=0;return;}
  drag=1;ox=tx;oy=ty;});
vp.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,e);
  if(pts.size===2){drag=0;dragCell=null;dragVtx=null;const[a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd)zm((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,d/pd);pd=d;return;}
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)+Math.abs(dy)>6)moved=1;
  if(dragVtx!==null&&vtxCell&&moved){const p=toPct(e.clientX,e.clientY);
    vtxCell.pts[dragVtx]=[p.x,p.y];
    const pg=ov.querySelector(`.lot[data-id="${vtxCell.id}"]`);
    if(pg)pg.setAttribute('points',vtxCell.pts.map(q=>`${q[0]/100*1700},${q[1]/100*IH}`).join(' '));
    drawHandles();return;}
  if(dragCell&&moved){const p=toPct(e.clientX,e.clientY);
    dragCell.cx=p.x;dragCell.cy=p.y;dragEl.style.left=p.x+'%';dragEl.style.top=p.y+'%';return;}
  if(!drag)return;tx=ox+dx;ty=oy+dy;ap();drawDraft();drawHandles();});
addEventListener('pointerup',e=>{
  pts.delete(e.pointerId);if(pts.size<2)pd=0;
  if(dragVtx!==null){if(moved&&vtxCell){
      vtxCell.cx=+(vtxCell.pts.reduce((s,p)=>s+p[0],0)/vtxCell.pts.length).toFixed(2);
      vtxCell.cy=+(vtxCell.pts.reduce((s,p)=>s+p[1],0)/vtxCell.pts.length).toFixed(2);
      save();toast('Đã chỉnh đỉnh');}
    dragVtx=null;drag=0;return;}
  if(dragCell){if(moved){save();toast('Đã dời ghim');}else openCell(dragCell);
    dragCell=null;dragEl=null;drag=0;return;}
  drag=0;});
vp.addEventListener('click',e=>{
  if(moved)return;
  if(editMode&&tool==='draw'){const p=toPct(e.clientX,e.clientY);draft.push([p.x,p.y]);drawDraft();return;}
  if(editMode&&tool==='pin'){const p=toPct(e.clientX,e.clientY);newCell(p.x,p.y);return;}
  const t=e.target.closest('.pin')||(e.target.classList&&e.target.classList.contains('lot')?e.target:null);
  if(t){const c=CELLS.find(x=>x.id===t.dataset.id);if(!c)return;
    if(editMode&&tool==='vtx'){if(!c.pts){toast('Ô ghim không có đỉnh để sửa');return;}
      vtxCell=c;markSel(c);drawHandles();toast('Kéo các đỉnh cho khớp ranh');return;}
    openCell(c);return;}
});

async function pullSheet(silent){
  if(!SHEET_URL){toast('Chưa cấu hình URL Sheet');return;}
  $('btnSync').classList.add('busy'); $('btnSync').textContent='↻ Đang tải…';
  try{
    const r=await fetch(SHEET_URL+'?t='+Date.now());
    const d=await r.json();
    if(!d.ok) throw new Error(d.err||'Lỗi');
    if(!d.cells.length){ if(!silent) toast('Sheet đang trống — hãy bấm ⬆ Đẩy lên Sheet trước'); return; }
    const byId={}; CELLS.forEach(c=>byId[c.id]=c);
    d.cells.forEach(s=>{
      const c=byId[s.id];
      if(c){ // giữ hình học của app nếu Sheet chưa có
        c.ten=s.ten||c.ten; c.loai=s.loai||c.loai; c.st=s.st||'';
        c.dt=s.dt; c.nganh=s.nganh; c.gia=s.gia; c.hopdong=s.hopdong;
        c.lienhe=s.lienhe; c.link=s.link; c.ghichu=s.ghichu;
        if(s.pts) c.pts=s.pts;
        if(s.cx) c.cx=s.cx; if(s.cy) c.cy=s.cy;
      }else{
        CELLS.push({id:s.id,ten:s.ten,loai:s.loai,cx:s.cx,cy:s.cy,pts:s.pts,
          dt:s.dt,nganh:s.nganh,st:s.st,gia:s.gia,hopdong:s.hopdong,
          lienhe:s.lienhe,link:s.link,ghichu:s.ghichu});
      }
    });
    save(); render(); paintUnits();
    toast('Đã tải '+d.cells.length+' ô từ Sheet');
  }catch(e){
    if(!silent) alert('Không tải được từ Sheet.\n\nKiểm tra:\n• URL kết thúc bằng /exec\n• Deploy đặt "Bất kỳ ai" (Anyone)\n• Đã chạy hàm taoSheet\n\nChi tiết: '+e.message);
  }finally{$('btnSync').classList.remove('busy');$('btnSync').textContent='↻ Tải Sheet';}
}
async function pushSheet(){
  if(!SHEET_URL){toast('Chưa cấu hình URL Sheet');return;}
  if(!confirm('Đẩy '+CELLS.length+' ô lên Sheet?\n\n• Ô mới sẽ được THÊM vào Sheet.\n• Toạ độ/đường bao sẽ được cập nhật.\n• Thông tin đã nhập tay trên Sheet KHÔNG bị ghi đè.'))return;
  toast('Đang đẩy lên Sheet…');
  try{
    const r=await fetch(SHEET_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({cells:CELLS})});
    const d=await r.json();
    if(!d.ok) throw new Error(d.err||'Lỗi');
    toast('Xong: thêm '+d.them+' ô, cập nhật '+d.capnhat+' ô');
  }catch(e){ alert('Không đẩy được lên Sheet.\n\n'+e.message); }
}

$('btnSheet').onclick=()=>{

  mb.appendChild(box);

  mk('⬆ Đẩy lên Sheet','p',()=>{const u=$('f_url').value.trim();
    if(!u){alert('Nhập URL trước');return;}
    SHEET_URL=u;try{localStorage.setItem(UKEY,u);}catch(e){}
    updSheetUI();closeModal();pushSheet();});
  mk('↻ Tải từ Sheet','e',()=>{const u=$('f_url').value.trim();
    if(!u){alert('Nhập URL trước');return;}
    SHEET_URL=u;try{localStorage.setItem(UKEY,u);}catch(e){}
    updSheetUI();closeModal();pullSheet(false);});
  mk('Đóng','g',closeModal);
  $('modal').classList.add('on');

const LAY=[[22,60],[104,60],[220,60],[302,60],[22,380],[104,380],[220,380],[302,380]];
U.forEach((u,i)=>{const id='unit'+u[0];
  if(!CELLS.find(c=>c.id===id))CELLS.push({id,ten:'UNIT '+u[0],loai:'nx',cx:0,cy:0,pts:null,hidden:1,
    dt:u[1]+' m²',nganh:"",st:"",gia:"",hopdong:"",lienhe:"",link:"",ghichu:""});
  const[x,y]=LAY[i],w=78,h=220;
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','unit');g.dataset.id=id;
  g.innerHTML=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#cbd5e1" fill-opacity=".65" stroke="#64748b"></rect>
   <text x="${x+w/2}" y="${y+h/2}" text-anchor="middle">${u[0]}</text>
   <text class="ar" x="${x+w/2}" y="${y+h/2+16}" text-anchor="middle">${u[1]} m²</text>`;
  g.onclick=()=>{const c=CELLS.find(z=>z.id===id);markSel(c);(editMode&&tool==='sel')?openForm(c):view(c);};
  $('ug').appendChild(g);});
function paintUnits(){document.querySelectorAll('.unit').forEach(g=>{
  const c=CELLS.find(z=>z.id===g.dataset.id);if(!c)return;
  g.querySelector('rect').setAttribute('fill',CO[c.st]);});}
function gotoGD6(){$('scMaster').classList.add('hidden');$('scGD6').classList.remove('hidden');
  $('btnBack').style.display='block';$('crumb').textContent='Tổng › RBF 73–80';paintUnits();closePanel();}
function gotoMaster(){$('scGD6').classList.add('hidden');$('scMaster').classList.remove('hidden');
  $('btnBack').style.display='none';$('crumb').textContent='Sơ đồ tổng';closePanel();}
$('btnBack').onclick=gotoMaster;

/* ===== tìm kiếm ===== */
$('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase(),s=$('sug');
  if(!v){s.style.display='none';return;}
  const h=CELLS.filter(c=>(c.ten||'').toLowerCase().includes(v)).slice(0,12);
  if(!h.length){s.style.display='none';return;}
  s.innerHTML=h.map((c,i)=>`<div data-i="${i}"><i style="background:${CO[c.st]}"></i>${c.ten}<small>${LOAI[c.loai]||''}</small></div>`).join('');
  s.style.display='block';
  s.querySelectorAll('div[data-i]').forEach(d=>d.onclick=()=>{s.style.display='none';$('q').value='';
    const c=h[d.dataset.i];
    if(c.hidden){gotoGD6();markSel(c);view(c);return;}
    if(!$('scGD6').classList.contains('hidden'))gotoMaster();
    tx=vp.clientWidth/2-c.cx/100*1700*sc; ty=vp.clientHeight*0.3-c.cy/100*IH*sc; ap();
    markSel(c);view(c);});});
document.addEventListener('click',e=>{if(!e.target.closest('.topbar')&&!e.target.closest('.sug'))$('sug').style.display='none';});

/* ===== PWA ===== */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('installBtn').style.display='block';});
$('installBtn').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('installBtn').style.display='none';};
(function(){const i=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const s=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 if(i&&!s)setTimeout(()=>$('iosTip').style.display='block',1800);})();

/* ===== CẬP NHẬT APP ===== */
$('btnUpd').onclick=async()=>{
  if(!confirm('Tải lại phiên bản app mới nhất từ máy chủ?\n\nDữ liệu bạn đã nhập trong app KHÔNG bị mất.'))return;
  toast('Đang cập nhật…');
  try{
    if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
  }catch(e){}
  location.reload(true);
};
/* tự phát hiện có bản mới */
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{});
  setTimeout(async()=>{try{
    const rs=await navigator.serviceWorker.getRegistrations();
    rs.forEach(r=>r.update());
  }catch(e){}}, 3000);
}

render();
if(SHEET_URL) pullSheet(true);
</script>
</body>
</html>
