<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tạo tài khoản VIP</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #0f172a; }
  label { display: block; margin-top: .9rem; font-weight: 600; font-size: .9rem; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .55rem .7rem; border: 1px solid #cbd5e1; border-radius: .5rem; font: inherit; }
  textarea { font-family: ui-monospace, monospace; font-size: .8rem; min-height: 4.5rem; }
  button { margin-top: 1rem; padding: .6rem 1rem; border: 0; border-radius: .6rem; background: #0d4792; color: #fff; font-weight: 600; cursor: pointer; }
  .note { font-size: .8rem; color: #64748b; margin-top: .4rem; }
  .warn { background: #fffbeb; border: 1px solid #fcd34d; padding: .6rem .8rem; border-radius: .5rem; font-size: .85rem; }
</style>
</head>
<body>
<h1>Tạo tài khoản VIP</h1>
<p class="warn">Tệp này chạy hoàn toàn trên máy của bạn, không gửi tên đăng nhập hay mật khẩu đi đâu. Hãy mở trực tiếp từ máy (không đăng lên trang web công khai) và đặt mật khẩu dài, khó đoán.</p>

<label for="salt">Muối (phải trùng với <code>vip.salt</code> trong config.js)</label>
<input id="salt" value="sonadezi-vip-doi-chuoi-nay" autocomplete="off">

<label for="user">Tên đăng nhập</label>
<input id="user" autocomplete="off">

<label for="pass">Mật khẩu</label>
<input id="pass" type="text" autocomplete="off">
<p class="note">Mật khẩu hiện rõ trên màn hình để bạn kiểm tra lại; hãy đóng trang sau khi xong.</p>

<button id="go" type="button">Tạo dòng khai báo</button>

<label for="out">Dán dòng này vào <code>vip.accounts</code> trong config.js</label>
<textarea id="out" readonly></textarea>
<button id="copy" type="button">Sao chép</button>

<script>
  async function sha256Hex(str) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const $ = id => document.getElementById(id);
  $('go').onclick = async () => {
    const salt = $('salt').value, user = $('user').value.trim().toLowerCase(), pass = $('pass').value;
    if (!user || !pass) { $('out').value = 'Vui lòng nhập tên đăng nhập và mật khẩu.'; return; }
    if (!(window.crypto && crypto.subtle)) { $('out').value = 'Trình duyệt không hỗ trợ mã hóa ở chế độ này. Hãy mở bằng Chrome/Edge.'; return; }
    const hash = await sha256Hex(`${salt}|${user}|${pass}`);
    $('out').value = `{ user: '${user.replace(/'/g, "\\'")}', hash: '${hash}' },`;
  };
  $('copy').onclick = () => { $('out').select(); try { document.execCommand('copy'); } catch (_) {} };
</script>
</body>
</html>
