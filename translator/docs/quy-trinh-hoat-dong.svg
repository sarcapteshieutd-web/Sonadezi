<text x="840" y="952" font-size="14" font-weight="400" fill="#334155">• Cần Internet ổn định: nhận diện giọng nói và dịch đều đi qua máy chủ bên ngoài.</text>
<text x="840" y="974" font-size="14" font-weight="400" fill="#334155">• Khi đọc bản dịch, micro tạm nghỉ nên người nói tiếp phải chờ; thương thảo hợp đồng nên TẮT đọc tiếng, chỉ xem chữ.</text>
<text x="840" y="996" font-size="14" font-weight="400" fill="#334155">• Đặt M0 Plus làm đầu vào và đầu ra mặc định của laptop; tăng dần âm lượng loa để kiểm tra không bị thu lại.</text>
<text x="840" y="1018" font-size="14" font-weight="400" fill="#334155">• Bản dịch máy chỉ hỗ trợ hiểu nhanh; điều khoản, số liệu phải xác nhận bằng văn bản chính thức.</text>
