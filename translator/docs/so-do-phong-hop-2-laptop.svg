<text x="60" y="890" font-size="17" font-weight="700" fill="#b45309" text-anchor="start">Quy ước khi họp</text>
<text x="60" y="914" font-size="14" font-weight="400" fill="#334155" text-anchor="start">1) Nói từng người một, hết câu chờ khoảng 1 đến 2 giây. Người nói chồng nhau làm giảm độ chính xác.   2) Hai laptop đặt xa nhau, hạ âm lượng loa.</text>
<text x="60" y="936" font-size="14" font-weight="400" fill="#334155" text-anchor="start">3) Mỗi bên đeo tai nghe có mic để tiếng đọc bản dịch không lọt vào micro máy kia.   4) Cả hai máy dùng Chrome, cho phép micro, cùng có mạng.</text>
<text x="60" y="958" font-size="14" font-weight="400" fill="#334155" text-anchor="start">5) Thành viên không ngồi hai bên chỉ cần điện thoại: quét QR người xem, không dùng liên kết của máy thứ 2.</text>
